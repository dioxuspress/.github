name: Bug report
description: Report a bug, panic, or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal commands, input data, or code snippet to reproduce the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version (`rustc --version`), and target (Web WASM / Desktop / CLI / Server).
      placeholder: "macOS 15 / rustc 1.88 / Web WASM"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any terminal output, browser console errors, or screenshots.
      render: shell
